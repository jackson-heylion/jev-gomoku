name: CI

on:
  push:
    branches: [main, chatgpt-sites-private-preview]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and Sites build
        run: npm run check

      - name: Validate Sites artifact
        run: |
          test -s dist/server/index.js
          test -s dist/.openai/hosting.json
          node --input-type=module -e "import('./dist/server/index.js').then(m => { if (!m.default || typeof m.default.fetch !== 'function') process.exit(1); })"

      - name: Enforce browser/server boundary
        run: |
          grep -q "const ENDPOINT = '/api/jev'" src/jev-client.js
          ! grep -R -n -E "api\.typesafe\.ai|dangerouslyAllowBrowser|jev_gomoku_api_key|Authorization.*Bearer" index.html jev-gomoku.html src
          grep -q "JEV_API_KEY" server/index.js
          grep -q "https://api.typesafe.ai/v1/systemone" server/index.js
          grep -q "'Content-Type': 'application/json'" server/index.js

      - name: Check static entrypoints
        run: |
          test -s index.html
          test -s jev-gomoku.html
          find dist -name deep-worker.js -type f -size +0c | grep -q .
          grep -q './assets/styles.css' index.html
          grep -q './src/jev-client.js' index.html
          grep -q './src/app.js' index.html
