name: Three-engine Benchmark

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Opening seed count (1-12)
        required: true
        default: '3'
      max_moves:
        description: Max plies per game
        required: true
        default: '60'
      mode:
        description: Local/Hybrid search mode
        required: true
        type: choice
        options:
          - expert
          - strong
        default: expert
      model:
        description: Jev model
        required: true
        default: jev-latest

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify benchmark harness
        run: npm run benchmark:smoke

      - name: Run Local / Jev Blind / Hybrid benchmark
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          BENCHMARK_CONFIRM: '1'
        run: |
          test -n "$JEV_API_KEY" || (echo "Missing repository secret JEV_API_KEY" && exit 1)
          npm run benchmark -- \
            --seeds "${{ inputs.seeds }}" \
            --max-moves "${{ inputs.max_moves }}" \
            --mode "${{ inputs.mode }}" \
            --model "${{ inputs.model }}"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: jev-gomoku-benchmark-${{ github.run_id }}
          path: benchmark/results/
          if-no-files-found: error
          retention-days: 30
