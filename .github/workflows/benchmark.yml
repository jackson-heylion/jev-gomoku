name: Jev Final-Decision Benchmark

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Opening count (1-12). 6 already takes a long time.
        required: true
        default: '4'
      max_plies:
        description: Max plies per game
        required: true
        default: '60'
      arms:
        description: Arms under test (white seat)
        required: true
        default: local,jev-final
      mode:
        description: Engine preset
        required: true
        type: choice
        options:
          - expert
          - strong
        default: expert
      model:
        description: Jev model
        required: true
        default: jev-latest
      arbitration_depth:
        description: Offline oracle depth used to adjudicate Jev overrides
        required: true
        default: '7'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify benchmark harness
        run: npm run benchmark:smoke

      - name: Run engine regressions
        run: npm run benchmark:regression

      - name: Run Jev final-decision benchmark
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          BENCHMARK_CONFIRM: '1'
        run: |
          test -n "$JEV_API_KEY" || (echo "Missing repository secret JEV_API_KEY" && exit 1)
          npm run benchmark -- \
            --seeds "${{ inputs.seeds }}" \
            --max-plies "${{ inputs.max_plies }}" \
            --arms "${{ inputs.arms }}" \
            --mode "${{ inputs.mode }}" \
            --model "${{ inputs.model }}" \
            --arbitration-depth "${{ inputs.arbitration_depth }}"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: jev-gomoku-benchmark-${{ github.run_id }}
          path: benchmark/results/
          if-no-files-found: error
          retention-days: 30
