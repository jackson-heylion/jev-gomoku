name: Final Two Historical Losses Audit
on:
  push:
    branches: [diag/final-two-losses]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: node benchmark/final-two-losses.mjs
