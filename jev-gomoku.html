<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Jev 五子棋</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #0f141b;
      --line: #2b3440;
      --muted: #8b98a8;
      --text: #edf2f7;
      --accent: #7ee787;
      --accent-2: #58a6ff;
      --danger: #ff7b72;
      --board: #c99b57;
      --board-line: rgba(50, 31, 11, .72);
      --shadow: rgba(0, 0, 0, .35);
      --cell: 34px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { color: inherit; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(88,166,255,.10), transparent 60%),
        radial-gradient(900px 520px at 100% 0%, rgba(126,231,135,.08), transparent 55%),
        var(--bg);
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #1f6feb, #238636);
      box-shadow: 0 8px 24px rgba(35,134,54,.16);
      font-weight: 800; letter-spacing: -.04em;
    }
    .brand h1 { font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--line);
      background: #1a222d;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      transition: .15s ease;
      min-height: 38px;
    }
    .btn:hover { background: #212b38; border-color: #3a4655; }
    .btn:disabled { opacity: .48; cursor: not-allowed; }
    .btn.primary { background: #238636; border-color: #2ea043; }
    .btn.primary:hover { background: #2ea043; }
    .btn.danger { color: #ffb4ad; }

    .layout {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: rgba(21, 27, 35, .92);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 44px var(--shadow);
    }

    .board-card { padding: 16px; overflow: hidden; }
    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      min-height: 38px;
    }
    .turn { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; }
    .stone-dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 4px rgba(0,0,0,.35); }
    .stone-dot.black { background: #101216; }
    .stone-dot.white { background: #f4f7fb; }
    .meta { color: var(--muted); font-size: 12px; text-align: right; }

    .board-wrap {
      display: grid;
      place-items: center;
      overflow: auto;
      border-radius: 12px;
      background: #9d743e;
      padding: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    canvas {
      display: block;
      width: min(100%, 650px);
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: manipulation;
      background: var(--board);
      box-shadow: 0 10px 26px rgba(0,0,0,.26);
    }
    canvas.disabled { cursor: wait; }

    .hint {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 11px;
      line-height: 1.55;
    }

    .side { display: grid; gap: 14px; }
    .side .card { padding: 15px; }
    .section-title { margin: 0 0 11px; font-size: 13px; color: #c7d1dc; font-weight: 700; letter-spacing: .02em; }

    .api-state {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 11px;
      padding: 10px 11px;
      background: var(--panel-2);
      border: 1px solid #242d38;
    }
    .api-state-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .indicator { width: 9px; height: 9px; border-radius: 50%; background: #6e7681; flex: 0 0 auto; }
    .indicator.ok { background: var(--accent); box-shadow: 0 0 0 4px rgba(126,231,135,.08); }
    .indicator.busy { background: #d29922; box-shadow: 0 0 0 4px rgba(210,153,34,.08); }
    .indicator.err { background: var(--danger); box-shadow: 0 0 0 4px rgba(255,123,114,.08); }
    .api-label { font-size: 12px; color: #c7d1dc; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .jev-card .big { font-size: 26px; font-weight: 760; letter-spacing: -.03em; margin: 1px 0 3px; }
    .jev-card .sub { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .confidence-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .confidence-row span { min-width: 58px; color: var(--muted); font-size: 11px; }
    .bar { flex: 1; height: 7px; background: #202833; border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #58a6ff, #7ee787); border-radius: inherit; transition: width .25s ease; }

    .alternatives { display: grid; gap: 7px; margin-top: 12px; }
    .alt { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    .alt strong { color: #dce5ee; font-size: 12px; }
    .mini { height: 5px; background: #202833; border-radius: 999px; overflow: hidden; }
    .mini i { display: block; height: 100%; background: #58a6ff; border-radius: inherit; }
    .alt em { font-style: normal; text-align: right; }

    .history { max-height: 270px; overflow: auto; display: grid; gap: 6px; padding-right: 2px; }
    .move {
      display: grid;
      grid-template-columns: 28px 18px 1fr auto;
      gap: 7px;
      align-items: center;
      padding: 7px 8px;
      border-radius: 9px;
      background: #111820;
      font-size: 12px;
    }
    .move .n { color: #6f7d8d; }
    .mini-stone { width: 13px; height: 13px; border-radius: 50%; }
    .mini-stone.black { background: #050607; border: 1px solid #38404b; }
    .mini-stone.white { background: #f4f7fb; }
    .move .coord { font-weight: 700; }
    .move .who { color: var(--muted); }

    .empty { color: var(--muted); font-size: 12px; line-height: 1.6; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,.62);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      backdrop-filter: blur(6px);
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(560px, 100%);
      background: #161d26;
      border: 1px solid #303a47;
      border-radius: 17px;
      box-shadow: 0 30px 80px rgba(0,0,0,.52);
      padding: 20px;
    }
    .modal h2 { margin: 0 0 5px; font-size: 18px; }
    .modal .desc { margin: 0 0 17px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field label { font-size: 12px; color: #c7d1dc; font-weight: 650; }
    .input-row { display: flex; gap: 8px; }

      width: 100%;
      border: 1px solid #303a47;
      background: #0f151d;
      color:
