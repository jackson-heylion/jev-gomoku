name: Historical Loss Audit

on:
  push:
    branches:
      - diag/historical-loss-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run deterministic historical loss audit
        run: node benchmark/historical-loss-audit.mjs
